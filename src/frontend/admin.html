<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>园区管理后台 · Cyra</title>
    <link rel="stylesheet" href="./styles/admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <p>园区管理后台</p>
          <h1>灵山胜境 AI 数字人运营看板</h1>
        </div>
        <nav class="admin-actions" aria-label="后台导航">
          <a id="avatarManagementLink" href="./avatar.html">形象管理</a>
          <a id="knowledgeManagementLink" href="./knowledge.html">知识库管理</a>
        </nav>
      </header>

      <section class="metrics-grid" id="metricsGrid"></section>

      <section class="admin-layout">
        <article class="panel large">
          <div class="panel-head">
            <div>
              <p>游客感受度报告</p>
              <h2>关注点、满意度与服务建议</h2>
            </div>
            <button id="refreshButton" type="button">刷新</button>
          </div>
          <div id="reportBox" class="report-box"></div>
        </article>

        <article class="panel">
          <div class="panel-head">
            <div>
              <p>运营趋势</p>
              <h2>满意度、停留时长与问答热度</h2>
            </div>
          </div>
          <div id="trendChart" class="trend-chart"></div>
        </article>

        <article class="panel">
          <div class="panel-head">
            <div>
              <p>游客画像</p>
              <h2>年龄与性别分布</h2>
            </div>
          </div>
          <div id="profileBox" class="bars"></div>
        </article>

        <article class="panel">
          <div class="panel-head">
            <div>
              <p>游客提问</p>
              <h2>热门问答列表</h2>
            </div>
          </div>
          <div id="frequentQuestionsPanel" class="rank-list"></div>
        </article>

        <article class="panel comment-moderation-panel">
          <div class="panel-head">
            <div>
              <p>游客内容管理</p>
              <h2>图文评论审核与景点图片入库</h2>
            </div>
            <select id="commentStatusFilter" aria-label="筛选评论状态">
              <option value="">全部状态</option>
              <option value="pending" selected>待审核</option>
              <option value="approved">已通过</option>
              <option value="rejected">已拒绝</option>
            </select>
          </div>
          <div id="commentModerationList" class="comment-moderation-list"></div>
        </article>
      </section>
    </main>

    <script type="module" src="./scripts/admin.js"></script>
  </body>
</html>
