<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>游客端数字人导览 · Cyra</title>
    <link rel="stylesheet" href="./styles/tourist.css" />
  </head>
  <body>
    <main class="tourist-shell immersive-stage">
      <section class="live2d-stage" id="live2d-stage" aria-label="景区 AI 数字人导游舞台">
        <img class="background-image" id="backgroundImage" alt="" aria-hidden="true" />
        <div class="scenic-backdrop" aria-hidden="true"></div>

        <header class="hero-title" aria-label="导览主题">
          <p>灵山胜境</p>
          <div class="hero-title-row">
            <button class="clear-conversation-button" id="clearConversationButton" type="button">清空对话</button>
            <h1>AI 数字人导游</h1>
          </div>
        </header>

        <canvas id="live2dCanvas" aria-label="Live2D 数字人画布"></canvas>

        <aside class="tourist-comment-panel" id="commentPanel" aria-label="游客景点评论区">
          <section class="spot-card" aria-label="当前景点简介">
            <div class="spot-panel-header">
              <div>
                <span class="spot-kicker">景点评论</span>
                <h2 id="spotTitle">灵山大佛</h2>
              </div>
              <label class="sr-only" for="spotSelector">切换景点</label>
              <select class="spot-selector" id="spotSelector" aria-label="切换评论景点"></select>
            </div>
            <div class="spot-image-frame">
              <img id="spotImage" src="./assets/scenic-spots/lingshan-buddha.png" alt="灵山大佛景点参考插画" />
              <span class="spot-image-caption">景点参考插画</span>
            </div>
            <p id="spotDescription">灵山大佛是灵山胜境的核心景观，适合礼佛祈福、远眺湖山与拍摄主轴线景观。</p>
          </section>

          <section class="spot-comments" aria-label="游客评论列表">
            <div class="spot-comments-header">
              <h3>游客评论</h3>
              <span id="spotCommentCount">0 条</span>
            </div>
            <div class="spot-comment-list" id="spotCommentList" aria-live="polite"></div>
          </section>

          <form class="spot-comment-form" id="spotCommentForm">
            <label class="sr-only" for="spotCommentInput">发表景点评论</label>
            <input id="spotCommentInput" type="text" maxlength="80" placeholder="写下你的游览感受..." autocomplete="off" />
            <label class="spot-comment-photo-button" for="spotCommentImage">
              <input id="spotCommentImage" type="file" accept="image/png,image/jpeg,image/webp" />
              <span>＋ 附上游客实拍</span>
            </label>
            <button type="submit">发布</button>
          </form>
        </aside>

        <section class="conversation" id="conversation" aria-label="对话区">
          <div class="message guide">
            <strong>数字人导游</strong>
            <p>您好，我可以介绍灵山大佛、九龙灌浴、梵宫，也可以帮您推荐游览路线。</p>
          </div>
        </section>

        <form class="chat-form tourist-composer" id="chatForm">
          <label class="icon-upload-button" title="上传图片">
            <input id="imageUpload" type="file" accept="image/png,image/jpeg,image/webp" />
            <span aria-hidden="true">+</span>
            <span class="sr-only">上传图片</span>
          </label>
          <button id="voiceInputButton" class="voice-input-button" type="button" aria-label="语音输入">
            <span aria-hidden="true">🎙</span>
          </button>
          <label class="sr-only" for="messageInput">输入想咨询的问题</label>
          <input id="messageInput" type="text" placeholder="问问景点、路线或拍照建议..." autocomplete="off" />
          <button class="send-button" type="submit">发送</button>
        </form>

        <div class="stage-status" id="stageStatus" role="status">正在准备 Live2D 数字人...</div>
      </section>
    </main>

    <script defer src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
    <script type="module" src="./scripts/tourist-live2d.js"></script>
  </body>
</html>
